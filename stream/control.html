<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>大肥鱼 · 场控</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 26px 30px; background: #16131c; color: #ece8f4;
         font: 15px/1.6 -apple-system, "Hiragino Sans GB", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 18px; font-weight: 600; }
  section { background: #201c29; border: 1px solid #342e42; border-radius: 14px;
            padding: 16px 18px; margin-bottom: 16px; max-width: 720px; }
  h2 { font-size: 14px; margin: 0 0 12px; color: #9d96ad; font-weight: 500;
       letter-spacing: .06em; text-transform: uppercase; }
  button { font: inherit; padding: 8px 16px; margin-right: 8px; border-radius: 9px;
           border: 1px solid #3d3550; background: #2a2436; color: #ece8f4; cursor: pointer; }
  button:hover { background: #352d45; }
  button.on { background: #2f4a6b; border-color: #4b7fb5; }
  input { font: inherit; padding: 9px 12px; border-radius: 9px; border: 1px solid #3d3550;
          background: #191521; color: #ece8f4; width: 300px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hint { color: #8d86a0; font-size: 13px; margin-top: 10px; }
  code { background: #191521; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
</style>
</head>
<body>
<h1>场控面板</h1>

<section>
  <h2>场景</h2>
  <div class="row">
    <button data-scene="idle">待机</button>
    <button data-scene="work">摸鱼</button>
    <button data-scene="talk">说话</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="wave">挥手</button>
    <button id="nod">点头</button>
    <button id="think">思考</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="heart">比心</button>
    <button id="clap">鼓掌</button>
    <button id="laugh">大笑</button>
    <button id="sigh">叹气</button>
    <button id="surprised">惊讶</button>
    <button id="sad">委屈</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="shake_head">摇头</button>
    <button id="jump">跳一下</button>
    <button id="stretch">伸懒腰</button>
    <button id="yawn">打哈欠</button>
    <button id="touch_head">摸头</button>
    <button id="fix_hair">理头发</button>
  </div>
  <p class="hint">切换只影响画面，不打断正在进行的一句。</p>
</section>

<section>
  <h2>手动发一条弹幕</h2>
  <div class="row">
    <input id="user" value="观众" maxlength="24" />
    <input id="text" placeholder="说点什么…" maxlength="120" />
    <button id="send">发送</button>
  </div>
  <p class="hint">走的是和真实弹幕同一条链路：<code>POST /comment</code> → 大脑 → 画面。</p>
</section>

<section>
  <h2>状态</h2>
  <div id="health" class="hint">读取中…</div>
</section>

<script>
const BRIDGE = `http://${location.hostname}:6220`;

document.querySelectorAll("[data-scene]").forEach((btn) => {
  btn.addEventListener("click", async () => {
    await fetch(BRIDGE + "/scene", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: btn.dataset.scene }),
    });
    document.querySelectorAll("[data-scene]").forEach((b) => b.classList.remove("on"));
    btn.classList.add("on");
  });
});

for (const name of ["wave", "nod", "think", "heart", "clap", "laugh", "sigh",
                    "surprised", "sad", "shake_head", "jump", "stretch", "yawn",
                    "touch_head", "fix_hair", "blow_kiss"]) {
  document.getElementById(name).addEventListener("click", async () => {
    await fetch(BRIDGE + "/event", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
  });
}

document.getElementById("send").addEventListener("click", async () => {
  const user = document.getElementById("user").value.trim() || "观众";
  const text = document.getElementById("text").value.trim();
  if (!text) return;
  const res = await fetch(BRIDGE + "/comment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user, text }),
  });
  document.getElementById("text").value = "";
  document.getElementById("health").textContent = await res.text();
});

async function poll() {
  try {
    const res = await fetch(BRIDGE + "/health");
    const d = await res.json();
    document.getElementById("health").textContent =
      `大脑 ${d.brain ? "已连接" : "断开"} · 队列 ${d.queue} · 已回 ${d.served} 条 · 丢弃 ${d.dropped} · 画面 ${d.stages}`;
  } catch (e) {
    document.getElementById("health").textContent = "连不上弹幕桥（6220）";
  }
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
