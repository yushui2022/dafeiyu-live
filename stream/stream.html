<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大肥鱼 · 直播画面</title>
<link rel="stylesheet" href="stream.css?v=17" />
</head>
<body>
<div id="stage">
  <video id="bg-video" autoplay loop muted playsinline></video>
  <img id="room" src="../assets/room.png" alt="" />
  <div id="light"></div>
  <canvas id="dust"></canvas>
  <div id="character" class="video-mode">
    <video id="pet-video" autoplay loop muted playsinline></video>
    <video id="pet-video-b" autoplay loop muted playsinline></video>
  </div>
  <div id="vignette"></div>

  <div id="watching">
    <span class="w-dot"></span>
    <span class="w-label">正在看</span>
    <span id="watching-text"></span>
  </div>

  <section id="dialog" aria-live="polite">
    <div class="dlg-label"><span id="dialog-label">她在说</span><span id="dialog-site"></span></div>
    <div id="dialog-lines"></div>
  </section>

  <div id="subtitle" class="hidden"><span id="subtitle-text"></span></div>

  <aside id="guide" class="panel">
    <h3>互动指南</h3>
    <ul class="guide-list">
      <li><span>发弹幕</span><em>她就会回你</em></li>
      <li><span>「比心」</span><em>比心</em></li>
      <li><span>「贴贴」</span><em>害羞</em></li>
      <li><span>「跳一个」</span><em>跳一下</em></li>
      <li><span>「笑一个」</span><em>大笑</em></li>
      <li><span>「摸头」</span><em>摸摸头</em></li>
      <li><span>小心心 / 辣条</span><em>比心 / 大笑</em></li>
      <li><span>上舰</span><em>鼓掌</em></li>
    </ul>
  </aside>

  <aside id="board" class="panel">
    <h3>今日互动榜</h3>
    <ol id="board-list"><li class="empty">还没有人上榜</li></ol>
    <p id="board-stats">弹幕 0 · 互动 0 人 · 礼物 0</p>
    <div id="board-token">
      <span class="u-label">今日 tokens</span>
      <span id="usage-value">—</span>
    </div>
  </aside>

  <div id="disclosure">AI 生成内容</div>
</div>
<script src="stream.js?v=43"></script>
</body>
</html>
