<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">大肥鱼直播运行时架构</title>
<desc id="desc">B 站事件进入 danmaku.py 和弹幕桥，弹幕桥连接 Hippocampus，直播页同时接收 TTS 声音并输出到 OBS。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9ced8"/>
  </marker>
</defs>
<rect width="1280" height="460" fill="#ffffff"/>
<g font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif">
  <text x="80" y="48" font-family="'SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="2.4" fill="#3f7fb6">RUNTIME ARCHITECTURE</text>
  <text x="80" y="94" font-size="36" font-weight="600" fill="#202531">一条弹幕的路径</text>
  <text x="80" y="126" font-size="17" fill="#667080">记忆在独立仓库里，直播侧只负责编排、出声和上屏。</text>
  <line x1="80" y1="152" x2="1200" y2="152" stroke="#c9ced8" stroke-width="1" opacity=".6"/>

  <circle cx="650" cy="194" r="18" fill="#f2f4f8" stroke="#c9ced8" stroke-width="1.4"/>
  <text x="650" y="198.5" text-anchor="middle" font-size="11" font-weight="700" fill="#3f7fb6">H</text>
  <text x="680" y="187" font-size="16" font-weight="600" fill="#202531">Hippocampus :6200</text>
  <text x="680" y="208" font-size="14" fill="#667080">记忆 · 人格 · DeepSeek</text>

  <circle cx="908" cy="194" r="18" fill="#f2f4f8" stroke="#c9ced8" stroke-width="1.4"/>
  <text x="908" y="198.5" text-anchor="middle" font-size="11" font-weight="700" fill="#3f7fb6">T</text>
  <text x="938" y="187" font-size="16" font-weight="600" fill="#202531">TTS :6211</text>
  <text x="938" y="208" font-size="14" fill="#667080">Qwen3-TTS · Sohee</text>

  <line x1="650" y1="212" x2="650" y2="281" stroke="#c9ced8" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="908" y1="212" x2="908" y2="281" stroke="#c9ced8" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="662" y="251" font-family="'SFMono-Regular',Menlo,monospace" font-size="12" fill="#667080">WebSocket</text>
  <text x="920" y="251" font-family="'SFMono-Regular',Menlo,monospace" font-size="12" fill="#667080">WAV</text>
  <line x1="140" y1="305" x2="1140" y2="305" stroke="#c9ced8" stroke-width="1.5"/>

  <circle cx="120" cy="305" r="21" fill="#ffffff" stroke="#3f7fb6" stroke-width="1.6"/>
  <text x="120" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#3f7fb6">01</text>
  <text x="120" y="355" text-anchor="middle" font-size="17" font-weight="600" fill="#202531">B 站</text>
  <text x="120" y="379" text-anchor="middle" font-size="14" fill="#667080">弹幕 / 礼物 / 上舰</text>

  <line x1="310" y1="305" x2="366" y2="305" stroke="#c9ced8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="388" cy="305" r="21" fill="#ffffff" stroke="#3f7fb6" stroke-width="1.6"/>
  <text x="388" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#3f7fb6">02</text>
  <text x="388" y="355" text-anchor="middle" font-size="17" font-weight="600" fill="#202531">danmaku.py</text>
  <text x="388" y="379" text-anchor="middle" font-size="14" fill="#667080">事件适配</text>

  <line x1="572" y1="305" x2="628" y2="305" stroke="#c9ced8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="650" cy="305" r="21" fill="#ffffff" stroke="#3f7fb6" stroke-width="1.6"/>
  <text x="650" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#3f7fb6">03</text>
  <text x="650" y="355" text-anchor="middle" font-size="17" font-weight="600" fill="#202531">弹幕桥</text>
  <text x="650" y="379" text-anchor="middle" font-size="14" fill="#667080">:6220 · 队列 / 去重</text>

  <line x1="830" y1="305" x2="886" y2="305" stroke="#c9ced8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="908" cy="305" r="21" fill="#ffffff" stroke="#3f7fb6" stroke-width="1.6"/>
  <text x="908" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#3f7fb6">04</text>
  <text x="908" y="355" text-anchor="middle" font-size="17" font-weight="600" fill="#202531">直播页</text>
  <text x="908" y="379" text-anchor="middle" font-size="14" fill="#667080">:6210 · 动作 / 字幕</text>

  <line x1="1082" y1="305" x2="1138" y2="305" stroke="#c9ced8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="1160" cy="305" r="21" fill="#ffffff" stroke="#3f7fb6" stroke-width="1.6"/>
  <text x="1160" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#3f7fb6">05</text>
  <text x="1160" y="355" text-anchor="middle" font-size="17" font-weight="600" fill="#202531">OBS</text>
  <text x="1160" y="379" text-anchor="middle" font-size="14" fill="#667080">浏览器源 · RTMP</text>

  <text x="80" y="438" font-size="13" fill="#667080">除了 Hippocampus，所有服务都在这台机器上。</text>
  <circle cx="1200" cy="433" r="3" fill="#3f7fb6"/>
  <text x="1190" y="437" text-anchor="end" font-family="'SFMono-Regular',Menlo,monospace" font-size="12" fill="#667080">LOCAL-FIRST</text>
</g>
</svg>