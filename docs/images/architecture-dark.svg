<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
<title id="title">大肥鱼直播运行时架构</title>
<desc id="desc">B 站事件进入 danmaku.py 和弹幕桥，弹幕桥连接 Hippocampus，直播页同时接收 TTS 声音并输出到 OBS。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4350"/>
  </marker>
</defs>
<g font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif">
  <text x="80" y="66" font-size="31" font-weight="600" fill="#e8ebf1">一条弹幕的路径</text>
  <line x1="80" y1="100" x2="1200" y2="100" stroke="#3b4350" stroke-width="1" opacity=".6"/>

  <circle cx="650" cy="148" r="8" fill="none" stroke="#7db8e8" stroke-width="1.8"/>
  <text x="674" y="154" font-size="17" font-weight="600" fill="#e8ebf1">Hippocampus :6200</text>

  <circle cx="908" cy="148" r="8" fill="none" stroke="#7db8e8" stroke-width="1.8"/>
  <text x="932" y="154" font-size="17" font-weight="600" fill="#e8ebf1">TTS :6211</text>

  <line x1="650" y1="158" x2="650" y2="228" stroke="#3b4350" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="908" y1="158" x2="908" y2="228" stroke="#3b4350" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="140" y1="250" x2="1140" y2="250" stroke="#3b4350" stroke-width="1.5"/>

  <circle cx="120" cy="250" r="9" fill="#7db8e8"/>
  <text x="120" y="302" text-anchor="middle" font-size="18" font-weight="600" fill="#e8ebf1">B 站</text>

  <line x1="310" y1="250" x2="366" y2="250" stroke="#3b4350" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="388" cy="250" r="9" fill="#7db8e8"/>
  <text x="388" y="302" text-anchor="middle" font-size="18" font-weight="600" fill="#e8ebf1">danmaku.py</text>

  <line x1="572" y1="250" x2="628" y2="250" stroke="#3b4350" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="650" cy="250" r="9" fill="#7db8e8"/>
  <text x="650" y="302" text-anchor="middle" font-size="18" font-weight="600" fill="#e8ebf1">弹幕桥 :6220</text>

  <line x1="830" y1="250" x2="886" y2="250" stroke="#3b4350" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="908" cy="250" r="9" fill="#7db8e8"/>
  <text x="908" y="302" text-anchor="middle" font-size="18" font-weight="600" fill="#e8ebf1">直播页 :6210</text>

  <line x1="1082" y1="250" x2="1138" y2="250" stroke="#3b4350" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="1160" cy="250" r="9" fill="#7db8e8"/>
  <text x="1160" y="302" text-anchor="middle" font-size="18" font-weight="600" fill="#e8ebf1">OBS</text>

</g>
</svg>